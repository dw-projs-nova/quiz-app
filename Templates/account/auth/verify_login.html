{% extends "base.html" %}

{% block title %}Confirm sign in{% endblock %}

{% block content %}
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-5">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title mb-3">Confirm sign in</h2>
                    <p class="text-muted">This link can be used only once.</p>
                    <form method="post">
                      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button class="btn btn-primary w-100" type="submit">Sign in to Quiz App</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
